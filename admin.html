<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Om Banna Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><a class="logo" href="index.html">Om Banna <small>Admin</small></a></header><main class="section"><h1>Admin Panel</h1><p>Production में admin role/RLS लगाकर केवल authorized account को यह panel दें.</p><form id="f"><input id="n" placeholder="Product name" required><input id="p" type="number" placeholder="Price" required><input id="s" placeholder="Size"><input id="i" placeholder="Image URL"><textarea id="d" placeholder="Description"></textarea><input id="st" type="number" placeholder="Stock" value="10"><button>Save Product</button></form><h2>Orders</h2><div id="orders"></div></main><script>
const {createClient}=supabase;const sb=createClient(OM_CONFIG.SUPABASE_URL,OM_CONFIG.SUPABASE_PUBLISHABLE_KEY);
f.onsubmit=async e=>{e.preventDefault();const {error}=await sb.from("products").insert({name:n.value,price:+p.value,size:s.value,image_url:i.value,description:d.value,stock:+st.value});alert(error?error.message:"Product saved");if(!error)e.target.reset();};
(async()=>{const {data}=await sb.from("orders").select("*").order("created_at",{ascending:false});orders.innerHTML=(data||[]).map(o=>`<div class="order"><b>${o.id}</b> · ${o.customer_name} · ${o.phone} · ₹${o.total} · ${o.payment_method} · ${o.payment_status}<br>${o.address}</div>`).join("")})();</script></body></html>
